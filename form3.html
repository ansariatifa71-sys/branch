<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
  <!DOCTYPE html>
  <html>

  <head>
    <title>Student Registration Form</title>
  </head>

  <body>

    <h2>Student Registration Form</h2>

    <form style="background-color: rgb(227, 148, 185);">
      <fieldset>
      <legend>personal information</legend>

      <label for="name">Full Name:</label><br>
      <input type="text" id="name" name="name"><br><br>

      <label for="email">Email:</label><br>
      <input type="email" id="email" name="email"><br><br>

      <label for="age">Age:</label><br>
      <input type="number" id="age" name="age"><br><br>

      <label for="course">Select Course:</label><br>
      <select id="course" name="course">
      </fieldest>
      <fieldset>
        <label>course information</label>

        <optgroup label=" Courses">
          <option>css</option>
          <option>html</option>
          <option>java script</option>
        </optgroup>

      </select><br><br>
    </fieldset>
    <fieldset>
      <legend> city informarion</legend>

      <label for="city">Select City:</label><br>
      <select id="city" name="city">

        <optgroup label="Maharashtra">
          <option>Mumbai</option>
          <option>Pune</option>
          <option>Nagpur</option>
        </optgroup>

        <optgroup label="Gujarat">
          <option>Ahmedabad</option>
          <option>Surat</option>
          <option>Vadodara</option>
        </optgroup>

      </select><br><br>
      </fieldset><br><br>

      <input type="submit" value="Submit" style="height: 40px; width: 80px; margin-left: 20px; margin-bottom: 20px;">

    </form>

  </body>

  </html>




</body>
</html>
