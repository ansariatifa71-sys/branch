<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <h1>Student Register Form</h1>
  <form action="submit" method="post">

    <label for="name">Full Name:</label><br>
    <input type="text" id="name" name="name" placeholder="Enter your Name" required /><br>
    <hr>
    <label for="email">Email</label><br>
    <input type="text" id="email" name="emai" placeholder="Enter your email" required /><br>
    <hr>
    <label for="password">password</label><br>
    <input type="text" id="password" name="password" placeholder="Enter your password" required /><br>
    <hr>
    <label>date of birth</label><br>
    <input type="date" id="date of birth" name="date of birth" placeholder="Enter your date of birth" required /><br>
    <hr>
    <p>Gender</p>
    <input type="radio" id="male" name="gander" value="male" />
    <label for="male">male</label><br>
    <input type="radio" id="female" name="gander" value="female" />
    <label for="female">female</label><br>
    <hr>
    <p>hobbies:</p>
    <input type="checkbox" id="hobby 1" name="hobby" value="reading" />
    <label for="hobby">reading</label><br>
    <input type="checkbox" id="hobby 2" name="hobby" value="coding" />
    <label for="hobby">coding</label><br>
    <hr>
    <label for="photo">uploded photo</label><br>
    <input type="file" id="photo" name="photo" />
    <hr>
    <input type="submit" value="Register" />
    <input type="reset" value="clear form">
</body>

</html>
